server:
  port: 8080

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 2048MB
      max-request-size: 2500MB
      file-size-threshold: 2KB

  datasource:
    url: jdbc:h2:file:./data/meetingsum;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  app-name: MeetingSum
  app-version: 0.1.0
  debug: true

  asr-provider: whisper_local
  whisper-model: medium
  whisper-device: cpu
  whisper-script-path: whisper_transcribe.py

  llm-provider: deepseek
  anthropic-api-key: ""
  anthropic-model: claude-sonnet-4-6
  deepseek-api-key: sk-b4ea2f4706a44b7da25a51fdaac86539
  deepseek-model: deepseek-chat
  deepseek-base-url: https://api.deepseek.com

  max-file-size-mb: 2048
  max-video-duration-seconds: 14400
  allowed-formats: mp4,mov,avi,mkv,mp3,wav,m4a,webm

  ffmpeg-path: D:/work/ffmpeg/ffmpeg-8.1.1-essentials_build/bin/ffmpeg.exe
  ffprobe-path: D:/work/ffmpeg/ffmpeg-8.1.1-essentials_build/bin/ffprobe.exe

  upload-dir: ./uploads
  output-dir: ./outputs

